name: Documentation and workspace foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Check documentation and configuration formatting
        run: npm run check
